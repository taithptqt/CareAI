name: Build and deploy ASP.Net Core app to Azure Web App - CareAi

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build CareAI/src/CareAI.API/CareAI.API.csproj --configuration Release

      - name: Verify overview data and caregiver access
        run: dotnet test CareAI/tests/CareAI.UnitTests/CareAI.UnitTests.csproj --filter "FullyQualifiedName~ElderOverviewTests|FullyQualifiedName~Part2DataContractTests|FullyQualifiedName~Part3FamilyAndRbacTests" --nologo

      - name: dotnet publish
        run: dotnet publish CareAI/src/CareAI.API/CareAI.API.csproj -c Release --no-build -o "${{ runner.temp }}/careai-api"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_22CDF5C87883404397C016613BEE724B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C1793D0E00764B0CBB62B502800327A9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2E2903039474410B61140FE777B4B6F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CareAi'
          slot-name: 'Production'
          package: ${{ runner.temp }}/careai-api