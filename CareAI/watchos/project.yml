name: CareAIWatch
options:
  bundleIdPrefix: vn.careai
settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CareAIWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.careai.careaiCompanion.watchkitapp
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/CareAIWatch-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources
        CODE_SIGN_ENTITLEMENTS: CareAIWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: CareAI
        INFOPLIST_KEY_NSHealthShareUsageDescription: CareAI reads heart rate and blood oxygen samples to share with an authorized family member.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: CareAI does not write health data.
        INFOPLIST_KEY_NSMotionUsageDescription: CareAI sử dụng cảm biến chuyển động để tự động phát hiện tai nạn té ngã và gửi tín hiệu cấp cứu.
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: vn.careai.careaiCompanion
        INFOPLIST_KEY_WKBackgroundModes:
          - workout-processing
          - physical-therapy
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - careai.healthsync
