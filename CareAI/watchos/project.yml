name: CareAIWatch
options:
  bundleIdPrefix: vn.careai
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  CareAIWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.careai.watch
        CODE_SIGN_ENTITLEMENTS: CareAIWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: CareAI
        INFOPLIST_KEY_NSHealthShareUsageDescription: CareAI reads heart rate and blood oxygen samples to share with an authorized family member.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: CareAI does not write health data.
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
